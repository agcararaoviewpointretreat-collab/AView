    <style>
      /* General Page Styling */
      body {
        background: url('jjk.jpg') no-repeat top center fixed; /* Image at the top */
            background-size: cover; /* Ensures it covers the entire page */
            line-height: 1.6;
          font-family: 'Poppins', sans-serif;
          margin: 0;
          padding: 0;
            display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          min-height: 100vh;
          padding: 40px 20px;
      }
          
      /* Page Title */
      h1 {
                    color: #226135;
                    margin-bottom: 20px;
                    text-align: center;
                    font-size: 2.2rem;
                    position: relative;
                    z-index: 2;
                }

      /* Form Container */
      form {
          background: rgba(255, 255, 255, 0.3);
          backdrop-filter: blur(10px);
          -webkit-backdrop-filter: blur(10px);
          padding: 30px;
          border-radius: 15px;
          box-shadow: 0 8px 32px rgba(31, 38, 135, 0.2);
          max-width: 500px;
          width: 100%;
          display: flex;
          flex-direction: column;
          gap: 15px;
      }

      /* Label Styling */
      label {
          display: block;
          font-weight: 600;
          color: #020202;
          margin-bottom: 5px;
      }

      /* Input & Select Styling */
      input, select {
          width: 100%;
          padding: 12px;
          border: 1px solid rgba(0, 0, 0, 0.1);
          border-radius: 8px;
            font-size: 14px;
          background: rgba(255, 255, 255, 0.7);
          color: #0b0a0a;
          transition: all 0.2s ease-in-out;
          box-sizing: border-box;
      }

      input:focus, select:focus {
          outline: none;
          border: 2px solid #FF7EB3;
          background: rgba(255, 255, 255, 0.9);
      }

      /* Two-Column Layout for Fields */
      .form-group {
          display: flex;
          justify-content: space-between;
          gap: 20px;
          width: 100%;
      }

      .form-group div {
          flex: 1;
      }

      /* Button Styling */
      button {
            width: 100%;
          background: linear-gradient(to right, #407934, #2e733f);
            color: white;
            border: none;
          padding: 14px;
            cursor: pointer;
          font-size: 16px;
          font-weight: bold;
          border-radius: 8px;
            transition: all 0.3s ease;
        }

      button:hover {
          background: linear-gradient(to right, #0a6731, #135a1e);
          transform: translateY(-2px);
          box-shadow: 0px 4px 10px rgba(255, 117, 140, 0.4);
      }

      /* Back to Rooms Button */
      .back-button {
          position: fixed;
          top: 20px;
          left: 20px;
          width: auto;
          background: linear-gradient(to right, #2b6928, #3f9234);
            color: white;
            border: none;
          padding: 10px 20px;
            font-size: 14px;
          font-weight: bold;
          border-radius: 8px;
          cursor: pointer;
            transition: all 0.3s ease;
        }

      .back-button:hover {
          background: linear-gradient(to right, #355e3f, #2e6d30);
            transform: translateY(-2px);
          box-shadow: 0px 4px 10px rgba(255, 117, 140, 0.4);
      }

            /* Responsive adjustments */
            @media (max-width: 600px) {
                label,
                input,
                select,
                button {
                    font-size: 12px !important;
                }
                .back-button {
                    padding: 6px 12px;
                    font-size: 11px;
                    top: 10px;
                    left: 10px;
                }
                    h1 {
                        font-size: 1.3rem;
                        margin-top: 18px;
                        margin-bottom: 16px;
                        position: static;
                        left: 0;
                        right: 0;
                        text-align: center;
                    }
                    .form-group {
                            flex-direction: column;
                            gap: 15px;
                    }
                    form {
                        padding: 20px;
                        max-width: 280px; /* Make the form thinner on mobile */
                    }
            }

      /* Add these styles to your existing CSS */
      .unavailable {
          background-color: #ffebee !important;
          color: #c62828 !important;
          cursor: not-allowed;
      }
      
      .ui-datepicker {
            background: white;
          border: 1px solid #2c5530;
          border-radius: 8px;
          padding: 10px;
      }
      
      .ui-datepicker-header {
          background: #2c5530;
          color: white;
          border: none;
            border-radius: 6px;
      }
      
      .ui-datepicker-prev,
      .ui-datepicker-next {
          color: white;
      }
      
      .ui-datepicker-calendar th {
            color: #2c5530;
      }
      
      .ui-state-default {
          border: 1px solid #e0e0e0;
          background: #f9f9f9;
      }
      
      .ui-state-active {
            background: #2c5530;
            color: white;
        }
      
      .ui-state-hover {

        }

        /* Custom Notification Styles */

    position: fixed;
    top: 32px;
    left: 50%;
    transform: translateX(-50%);
    min-width: 220px;
    max-width: 88vw;
    background: linear-gradient(90deg, #e8f5e9 0%, #fffbe7 100%);

}

    <script type="module">
        // Import Firebase modules
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, push, get, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Firebase configuration
        const firebaseConfig = {
          apiKey: "AIzaSyBAE0ieuAJRp_rF4I90qXP8zPr4TQW_rIg",
          authDomain: "agcararaoret.firebaseapp.com",
          databaseURL: "https://agcararaoret-default-rtdb.firebaseio.com",
          projectId: "agcararaoret",
          storageBucket: "agcararaoret.appspot.com",
          messagingSenderId: "369964400118"
        };
    
        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let unavailableDates = [];
        let bookContent = null;

        // Load dynamic Book content (prices, limits, display names)
        async function loadBookContent(){
            try{
                const snap = await get(ref(db, 'siteContent/book'));
                if (snap.exists()) {
                    bookContent = snap.val();
                    // Do not override option labels with display names (per request to remove name display)
                    // Reflect dynamic down payment percent in UI label
                    const paymentTypeSel = document.getElementById('paymentType');
                    if (paymentTypeSel && paymentTypeSel.options && paymentTypeSel.options.length) {
                        const dp = (bookContent.downPaymentPercent != null ? parseInt(bookContent.downPaymentPercent)||30 : 30);
                        paymentTypeSel.options[0].textContent = `${dp}% Down Payment (Gcash)`;
                    }
                    // Recalculate with the latest down payment percent
                    try { updateTotal(); updatePaymentAmount(); } catch(_e) {}
                }
            }catch(_e){ /* ignore */ }
        }

        async function fetchBookedDates() {
            try {
                const bookingsRef = ref(db, "bookings");
                const snapshot = await get(bookingsRef);
                if (snapshot.exists()) {
                    unavailableDates = [];
                    const selectedRoom = document.getElementById("selectedRoom").value;
                    const numberOfRooms = parseInt(document.getElementById("numberOfRooms").value) || 1;
                    
                    // Create a map to track room bookings per date
                    const roomBookingsPerDate = new Map();
                    
                    snapshot.forEach((childSnapshot) => {
                        const booking = childSnapshot.val();
                        const bookingStatus = booking.status || "pending";
                        
                        // Only count bookings that are pending, confirmed, or approved
                        // Exclude rejected/declined bookings to make those dates available again
                        const validStatuses = ["pending", "confirmed", "approved"];
                        
                        if (booking.selectedRoom === selectedRoom && validStatuses.includes(bookingStatus)) {
                            let currentDate = new Date(booking.checkInDate);
                            const checkOutDate = new Date(booking.checkOutDate);
                            const roomsBooked = parseInt(booking.numberOfRooms) || 1;

                            while (currentDate <= checkOutDate) {
                                const dateStr = currentDate.toISOString().split("T")[0];
                                const currentBookings = roomBookingsPerDate.get(dateStr) || 0;
                                roomBookingsPerDate.set(dateStr, currentBookings + roomsBooked);
                                currentDate.setDate(currentDate.getDate() + 1);
                            }
                        }
                    });

                    // For Casa De Amor, check if the requested number of rooms is available
                    if (selectedRoom === "Casa De Amor") {
                        roomBookingsPerDate.forEach((bookedRooms, date) => {
                            if (bookedRooms + numberOfRooms > 3) {
                                unavailableDates.push(date);
                            }
                        });
                    } else {
                        // For other rooms, mark dates as unavailable if any booking exists
                        roomBookingsPerDate.forEach((_, date) => {
                            unavailableDates.push(date);
                        });
                    }
                }
                initDatePicker();
            } catch (error) {
                console.error("Error fetching booked dates:", error);
            }
        }

        function initDatePicker() {
            flatpickr("#checkInDate", {
                dateFormat: "Y-m-d",
                disable: [
                    ...unavailableDates.map(date => ({ from: date, to: date })), // Disable booked dates
                    { from: "1900-01-01", to: new Date().toISOString().split("T")[0] } // Disable past dates
                ],
                onChange: function(selectedDates, dateStr, instance) {
                    updateTotal();
                    // Update check-out date picker min date
                    if (selectedDates.length > 0) {
                        const checkOutPicker = document.querySelector("#checkOutDate")._flatpickr;
                        if (checkOutPicker) {
                            // Set min date to the day after check-in
                            const nextDay = new Date(selectedDates[0]);
                            nextDay.setDate(nextDay.getDate() + 1);
                            checkOutPicker.set("minDate", nextDay);
                            // If current check-out date is before or same as new check-in date, clear it
                            if (checkOutPicker.selectedDates[0] && 
                                (checkOutPicker.selectedDates[0] <= selectedDates[0])) {
                                checkOutPicker.clear();
                            }
                        }
                    }
                },
                locale: { firstDayOfWeek: 1 },
                onDayCreate: function(dObj, dStr, fp, dayElem) {
                    const dateStr = dayElem.getAttribute("aria-label");
                    if (unavailableDates.includes(dateStr)) {
                        dayElem.style.backgroundColor = "#ffebee";
                        dayElem.style.color = "#c62828";
                    }
                }
            });

            flatpickr("#checkOutDate", {
                dateFormat: "Y-m-d",
                disable: [
                    ...unavailableDates.map(date => ({ from: date, to: date })), // Disable booked dates
                    { from: "1900-01-01", to: new Date().toISOString().split("T")[0] } // Disable past dates
                ],
                onChange: function(selectedDates, dateStr, instance) {
                    updateTotal();
                },
                locale: { firstDayOfWeek: 1 },
                onDayCreate: function(dObj, dStr, fp, dayElem) {
                    const dateStr = dayElem.getAttribute("aria-label");
                    if (unavailableDates.includes(dateStr)) {
                        dayElem.style.backgroundColor = "#ffebee";
                        dayElem.style.color = "#c62828";
                    }
                }
            });
        }

        document.getElementById("selectedRoom").addEventListener("change", function() {
            fetchBookedDates();
        });

        // Populate room options from Rooms content (keeps internal values as room keys)
        async function buildRoomOptions(){
            try{
                const [roomsSnap, bookSnap] = await Promise.all([
                    get(ref(db,'siteContent/rooms')),
                    get(ref(db,'siteContent/book'))
                ]);
                const rooms = roomsSnap.exists() ? (roomsSnap.val()?.items||[]) : [];
                // Do not use displayMap for labels to avoid showing old/custom names
                const sel = document.getElementById('selectedRoom');
                if (!sel) return;
                const currentVal = sel.value;
                if (rooms.length){
                    sel.innerHTML = '';
                    rooms.forEach(r=>{
                        const key = r.name || '';
                        if (!key) return;
                        const opt = document.createElement('option');
                        opt.value = key;
                        opt.textContent = key;
                        sel.appendChild(opt);
                    });
                    if (currentVal) sel.value = currentVal;
                }
            }catch(_e){ /* ignore */ }
        }

        // Initial load: fetch book content, build options, then dates
        Promise.resolve()
            .then(loadBookContent)
            .then(buildRoomOptions)
            .then(fetchBookedDates);

        // Live update down payment percent and recalculations if admin changes it
        try {
            onValue(ref(db, 'siteContent/book'), (snap)=>{
                if (!snap.exists()) return;
                bookContent = snap.val() || {};
                const paymentTypeSel = document.getElementById('paymentType');
                if (paymentTypeSel && paymentTypeSel.options && paymentTypeSel.options.length) {
                    const dp = (bookContent.downPaymentPercent != null ? parseInt(bookContent.downPaymentPercent)||30 : 30);
                    paymentTypeSel.options[0].textContent = `${dp}% Down Payment (Gcash)`;
                }
                // Recalc totals with new settings
                try { updateTotal(); updatePaymentAmount(); } catch(_e) {}
            });
        } catch(_e) {}

        // --- Notification Utility ---
window.showNotification = function(message, type = 'info', duration = 25000) {
    const notif = document.getElementById('customNotification');
    const msg = document.getElementById('notifMessage');
    notif.className = 'custom-notification';
    msg.innerHTML = message;
    notif.style.display = 'flex';
    setTimeout(() => notif.classList.add('show'), 10);
    if (notif._timeout) clearTimeout(notif._timeout);
    notif._timeout = setTimeout(() => hideNotification(), 25000);
};
window.hideNotification = function() {
    const notif = document.getElementById('customNotification');
    notif.classList.remove('show');
    setTimeout(() => { notif.style.display = 'none'; }, 300);
};

        window.confirmBooking = async function() {
            const submitBtn = document.querySelector('button[onclick="confirmBooking()"]');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.style.pointerEvents = 'none';
            }
            const fullName = document.getElementById("fullName").value;
            const email = document.getElementById("email").value;
            const phone = document.getElementById("phone").value;
            const adults = document.getElementById("adults").value;
            const children = document.getElementById("children").value;
            const babies = document.getElementById("babies").value;
            const selectedRoom = document.getElementById("selectedRoom").value;
            const numberOfRooms = document.getElementById("numberOfRooms").value;
            const checkInDate = document.getElementById("checkInDate").value;
            const checkOutDate = document.getElementById("checkOutDate").value;
            const extraPax = document.getElementById("extraPax").value;
            const extraChildren = document.getElementById("extraChildren").value;
            const numberOfNights = document.getElementById("numberOfNights").value;
            const totalAmount = document.getElementById("totalAmount").value;
            const paymentType = document.getElementById("paymentType").value;
            const paymentAmount = document.getElementById("paymentAmount").value;

            // --- Prevent booking if any date in the range is unavailable (including all nights of stay) ---
            if (checkInDate && checkOutDate) {
                let start = new Date(checkInDate);
                let end = new Date(checkOutDate);
                let invalid = false;
                // Check every night of the stay (from check-in to the night before check-out)
                while (start < end) {
                    const dateStr = start.toISOString().split('T')[0];
                    if (unavailableDates.includes(dateStr)) {
                        invalid = true;
                        break;
                    }
                    start.setDate(start.getDate() + 1);
                }
                // Strict: block if the first night after check-in is unavailable
                let firstNight = new Date(checkInDate);
                firstNight.setDate(firstNight.getDate() + 1);
                const firstNightStr = firstNight.toISOString().split('T')[0];
                if (unavailableDates.includes(firstNightStr)) {
                    showNotification("You cannot book this check-in date because the next night is unavailable.", 'info', 15000);
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.style.pointerEvents = '';
                    }
                    return;
                }
                if (invalid) {
                    showNotification("You cannot book this range. One or more dates between your check-in and check-out are unavailable.", 'info', 15000);
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.style.pointerEvents = '';
                    }
                    return;
                }
            }

            // Check if the email is a valid Gmail address
            const gmailRegex = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
            if (!gmailRegex.test(email)) {
                showNotification("Please enter a valid Gmail address (example@gmail.com).", 'info', 15000);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.style.pointerEvents = '';
                }
                return;
            }

            if (!fullName || !email || !phone || !adults || !checkInDate || !checkOutDate || !totalAmount) {
                showNotification("Please fill in all required fields!", 'info', 15000);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.style.pointerEvents = '';
                }
                return;
            }
            if (!/^\d{11}$/.test(phone)) {
                showNotification("Phone number must be exactly 11 digits.", 'info', 15000);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.style.pointerEvents = '';
                }
                return;
            }
            try {
                const bookingsRef = ref(db, "bookings");
                await push(bookingsRef, {
                    fullName,
                    email,
                    phone,
                    adults,
                    children,
                    babies,
                    selectedRoom,
                    numberOfRooms,
                    checkInDate,
                    checkOutDate,
                    extraPax,
                    extraChildren,
                    numberOfNights,
                    totalAmount,
                    paymentType,
                    paymentAmount,
                    status: "pending",
                    createdAt: new Date().toISOString()
                });

                showNotification(
                    'Reservation submitted successfully!<br><br>Please wait for a <strong>confirmation email</strong> from the resort to finalize your booking. If you don’t see it in your inbox, please check your <strong>spam or junk folder</strong>. Please note that a <span class="notif-highlight">' + document.getElementById('paymentAmount').value + ' down payment</span> is required to confirm your reservation. ',
                    'info',
                    15000
                );
                document.getElementById("bookingForm").reset();
                fetchBookedDates();
                // Do NOT re-enable the button after successful booking
                setTimeout(function() { window.location.href = 'rooms.html'; }, 15000);
            } catch (error) {
                console.error("Error saving booking:", error);
                showNotification('Error submitting reservation. Please try again.', 'info', 15000);
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.style.pointerEvents = '';
                }
            }
        };

        window.adjustRoomOptions = function() {
            const selectedRoom = document.getElementById("selectedRoom").value;
            const roomInput = document.getElementById("numberOfRooms");

            // Prefer dynamic maxRooms from Book content; no hardcoded fallbacks
            const dynMax = (bookContent && bookContent.maxRooms && bookContent.maxRooms[selectedRoom] != null)
                ? (parseInt(bookContent.maxRooms[selectedRoom]) || 1)
                : (parseInt(roomInput.max||'1') || 1);
            roomInput.max = dynMax;
            if (parseInt(roomInput.value||'0') > dynMax) roomInput.value = dynMax;
        };

        window.updateTotal = function() {
            const nights = calculateNights();
            document.getElementById("numberOfNights").value = nights;

            const selectedRoom = document.getElementById("selectedRoom").value;
            // Use dynamic pricing and limits only; no hardcoded legacy defaults
            const extraPriceDefault = 300;
            const extraChildPriceDefault = 250; // Default: Extra children (4-10 years) cost 250 per head

            const price = (bookContent && bookContent.roomPrice && bookContent.roomPrice[selectedRoom] != null)
                ? (parseInt(bookContent.roomPrice[selectedRoom]) || 0)
                : 0;
            let rooms = parseInt(document.getElementById("numberOfRooms").value);
            let extraPax = parseInt(document.getElementById("extraPax").value) || 0;
            let extraChildren = parseInt(document.getElementById("extraChildren").value) || 0;

            // Limit combined extra pax (adults + children) based on room type
            const maxAllowedPax = (bookContent && bookContent.maxExtraPax && bookContent.maxExtraPax[selectedRoom] != null)
                ? (parseInt(bookContent.maxExtraPax[selectedRoom]) || 0)
                : (selectedRoom === 'Casa De Amor' ? 4 : selectedRoom === 'Casa Y Agua' ? 20 : 10);
            
            const totalExtraPax = extraPax + extraChildren;
            if (totalExtraPax > maxAllowedPax) {
                // Adjust to fit within the limit, prioritizing adults
                const excess = totalExtraPax - maxAllowedPax;
                if (extraChildren >= excess) {
                    extraChildren = extraChildren - excess;
                    document.getElementById("extraChildren").value = extraChildren;
                } else {
                    extraPax = maxAllowedPax - extraChildren;
                    document.getElementById("extraPax").value = extraPax;
                }
            }

            // Enforce max rooms per type from Book content if available; otherwise keep current input constraints
            const dynMaxRooms = (bookContent && bookContent.maxRooms && bookContent.maxRooms[selectedRoom] != null)
                ? (parseInt(bookContent.maxRooms[selectedRoom]) || 1)
                : (parseInt(document.getElementById("numberOfRooms").max||'1')||1);
            if (rooms > dynMaxRooms) {
                rooms = dynMaxRooms;
                document.getElementById("numberOfRooms").value = dynMaxRooms;
            }

            // Calculate total cost
            const roomTotal = price * rooms * nights;
            const extraPricePerHead = (bookContent && bookContent.extraPaxPrice && bookContent.extraPaxPrice[selectedRoom] != null)
                ? parseInt(bookContent.extraPaxPrice[selectedRoom]) || extraPriceDefault
                : extraPriceDefault;
            const extraChildPrice = (bookContent && bookContent.extraChildrenPrice && bookContent.extraChildrenPrice[selectedRoom] != null)
                ? parseInt(bookContent.extraChildrenPrice[selectedRoom]) || extraChildPriceDefault
                : extraChildPriceDefault;
            const extraPaxTotal = extraPax * extraPricePerHead * nights; // Extra adults at dynamic price
            const extraChildrenTotal = extraChildren * extraChildPrice * nights; // Extra children at dynamic price
            const totalPrice = roomTotal + extraPaxTotal + extraChildrenTotal;

            const totalAmount = `₱${Math.round(totalPrice).toLocaleString()}`;
            document.getElementById("totalAmount").value = totalAmount;
            
            // Store room total for payment calculation
            document.getElementById("totalAmount").dataset.roomTotal = Math.round(roomTotal);
            
            // Update payment amount
            updatePaymentAmount();
        };

        window.calculateNights = function() {
            const checkInDate = document.getElementById("checkInDate").value;
            const checkOutDate = document.getElementById("checkOutDate").value;

            if (!checkInDate || !checkOutDate) return 1;

            const checkIn = new Date(checkInDate);
            const checkOut = new Date(checkOutDate);
            
            if (isNaN(checkIn.getTime()) || isNaN(checkOut.getTime()) || checkOut <= checkIn) {
                return 1;
            }

            return Math.floor((checkOut - checkIn) / (1000 * 60 * 60 * 24));
        };

        window.updatePaymentAmount = function() {
            const totalAmountField = document.getElementById("totalAmount");
            const paymentType = document.getElementById("paymentType").value;
            const paymentAmount = document.getElementById("paymentAmount");
            
            if (totalAmountField && totalAmountField.dataset.roomTotal) {
                // Calculate 30% only from room cost (excluding extra pax)
                const roomTotal = parseFloat(totalAmountField.dataset.roomTotal);
                if (paymentType === "partial") {
                    const dpPercent = (typeof bookContent !== 'undefined' && bookContent && bookContent.downPaymentPercent != null)
                        ? (parseInt(bookContent.downPaymentPercent) || 30)
                        : 30;
                    const partialAmount = roomTotal * (dpPercent / 100);
                    paymentAmount.value = `₱${Math.round(partialAmount).toLocaleString()}`;
                }
            }
        };

        window.validatePersonCount = function() {
            const selectedRoom = document.getElementById("selectedRoom").value;
            const adults = parseInt(document.getElementById("adults").value) || 0;
            const children = parseInt(document.getElementById("children").value) || 0;
            const babies = parseInt(document.getElementById("babies").value) || 0;
            const totalPersons = adults + children; // Babies don't count toward capacity

            // Get maxPersons from bookContent (dynamically loaded from admin settings)
            const maxPersons = (bookContent && bookContent.maxPersons && bookContent.maxPersons[selectedRoom] != null)
                ? parseInt(bookContent.maxPersons[selectedRoom])
                : (selectedRoom === 'Casa De Amor' ? 2 : 5); // Default: Casa De Amor = 2, others = 5

            // If total exceeds max, adjust the last changed field
            if (totalPersons > maxPersons) {
                const excess = totalPersons - maxPersons;
                showNotification(
                    `The maximum capacity for <span class="notif-highlight">${selectedRoom}</span> is <span class="notif-highlight">${maxPersons} persons</span>.<br><br>You have entered <span class="notif-highlight">${totalPersons} persons</span> (${adults} adults + ${children} children). Babies are not counted.<br><br>Please use the <strong>Extra Pax</strong> field for additional guests beyond the base capacity, which will incur additional charges.`,
                    'info',
                    8000
                );
                
                // Auto-adjust: reduce children first, then keep adults at minimum 1
                if (children > 0) {
                    document.getElementById("children").value = Math.max(0, children - excess);
                } else if (adults > maxPersons) {
                    document.getElementById("adults").value = maxPersons;
                }
            }
        };
    </script>
</head>
<body>
    <!-- Custom Notification Popup -->
    <div id="customNotification" class="custom-notification" style="display:none;">
        <span class="notif-message" id="notifMessage"></span>
        <button class="notif-close" onclick="hideNotification()">&times;</button>
    </div>

    <button class="back-button" onclick="window.location.href='rooms.html'">⬅ Back to Rooms</button>

    <h1>Stay With Us!</h1>
    <form id="bookingForm">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" required>
    
        <label for="email">Email Address (Use your existing/main Gmail account):</label>
<input type="email" id="email" placeholder="yourname@gmail.com" required pattern="[a-zA-Z0-9._%+-]+@gmail\.com$" title="Please enter your existing Gmail address">

    <label for="phone">Phone Number:</label>

    <input type="tel" id="phone" name="phone" maxlength="11" inputmode="numeric" placeholder="09XXXXXXXXX" required oninput="this.value=this.value.replace(/[^0-9]/g,''); if(this.value.length>11)this.value=this.value.slice(0,11);">

    <div class="form-group">
        <div>
            <label for="adults">Adults:</label>
            <input type="number" id="adults" value="1" min="1" required onchange="validatePersonCount()">
        </div>
        <div>
            <label for="children">Children (4-10 yrs):</label>
            <input type="number" id="children" value="0" min="0" required onchange="validatePersonCount()">
        </div>
        <div>
            <label for="babies">Babies (0-3 yrs):</label>
            <input type="number" id="babies" value="0" min="0" required onchange="validatePersonCount()">
        </div>
    </div>
    
        <div class="form-group">
            <div>
                <label for="selectedRoom">Selected Room:</label>
                <select id="selectedRoom" onchange="adjustRoomOptions(); validatePersonCount(); updateTotal();">
                    <option value="Casa De Amor">Casa De Amor</option>
                    <option value="Casa De Arced">Casa De Arced</option>
                    <option value="Casa De Bella">Casa De Bella</option>
                    <option value="Casa Y Agua">Casa Y Agua</option>
                </select>
            </div>
            <div>
                <label for="numberOfRooms">Number of Rooms:</label>
                <input type="number" id="numberOfRooms" value="1" min="1" onchange="updateTotal()">
            </div>
        </div>

        <div class="form-group">
            <div>
                <label for="extraChildren">Extra Children (₱250 per head):</label>
                <input type="number" id="extraChildren" value="0" min="0" oninput="updateTotal()">
            </div>
            <div>
                <label for="extraPax">Extra Adults (₱300 per head):</label>
                <input type="number" id="extraPax" value="0" min="0" oninput="updateTotal()">
            </div>
        </div>
    
        <div class="form-group">
            <div>
                <label for="checkInDate">Check-in Date:</label>
                <input type="text" id="checkInDate" required>
            </div>
            <div>
                <label for="checkOutDate">Check-out Date:</label>
                <input type="text" id="checkOutDate" required>
            </div>
        </div>
    
        <div class="form-group">
            <div>
                <label for="numberOfNights">Number of Nights:</label>
                <input type="number" id="numberOfNights" required readonly>
            </div>
            <div>
                <label for="totalAmount">Total Amount to Pay:</label>
                <input type="text" id="totalAmount" required readonly>
            </div>
        </div>

        <div class="form-group">
            <div>
                <label for="paymentType">Payment Type:</label>
                <select id="paymentType" onchange="updatePaymentAmount()">
                    <option value="partial">Down Payment (Gcash)</option>
                </select>
            </div>
            <div>
                <label for="paymentAmount">Amount to Pay:</label>
                <input type="text" id="paymentAmount" required readonly>
            </div>
        </div>
    
        <button type="button" onclick="confirmBooking()">Confirm Booking</button>
    </form>
    
    
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script>
         document.addEventListener("DOMContentLoaded", function () {
        const urlParams = new URLSearchParams(window.location.search);
        const selectedRoom = urlParams.get("room");
        const roomsCount = urlParams.get("rooms") ? Math.min(3, parseInt(urlParams.get("rooms"))) : 1;

        if (selectedRoom) {
            document.getElementById("selectedRoom").value = selectedRoom;
            adjustRoomOptions(); 

            if (selectedRoom === "Casa De Amor") {
                document.getElementById("numberOfRooms").value = roomsCount;
            }
        }
    });

    function adjustRoomOptions() {
        const selectedRoom = document.getElementById("selectedRoom").value;
        const roomInput = document.getElementById("numberOfRooms");

    if (selectedRoom === "Casa De Amor") {
            roomInput.max = 3;
        } else {
            roomInput.max = 1;
            roomInput.value = 1;
        }
    }

        function calculateNights() {
            const checkInDate = document.getElementById("checkInDate").value;
            const checkOutDate = document.getElementById("checkOutDate").value;

            if (!checkInDate || !checkOutDate) return 1;

            const checkIn = new Date(checkInDate);
            const checkOut = new Date(checkOutDate);
            
            if (isNaN(checkIn.getTime()) || isNaN(checkOut.getTime()) || checkOut <= checkIn) {
                return 1;
            }

            return Math.floor((checkOut - checkIn) / (1000 * 60 * 60 * 24));
        }

        function updatePaymentAmount() {
            const totalAmountField = document.getElementById("totalAmount");
            const paymentType = document.getElementById("paymentType").value;
            const paymentAmount = document.getElementById("paymentAmount");
            
            if (totalAmountField && totalAmountField.dataset.roomTotal) {
                // Calculate 30% only from room cost (excluding extra pax)
                const roomTotal = parseFloat(totalAmountField.dataset.roomTotal);
                if (paymentType === "partial") {
                    const dpPercent = (typeof bookContent !== 'undefined' && bookContent && bookContent.downPaymentPercent != null)
                        ? (parseInt(bookContent.downPaymentPercent) || 30)
                        : 30;
                    const partialAmount = roomTotal * (dpPercent / 100);
                    paymentAmount.value = `₱${Math.round(partialAmount).toLocaleString()}`;
                }
            }
        }

        function updateTotal() {
    const nights = calculateNights();
    document.getElementById("numberOfNights").value = nights;

    const roomPrice = {
        "Casa De Amor": 1500,
        "Casa De Bella": 3000,
        "Casa De Arced": 3500,
        "Casa Y Agua": 4999
    };

    const maxExtraPax = {
        "Casa De Amor": 4,
        "Casa De Bella": 10,
        "Casa De Arced": 10,
        "Casa Y Agua": 20
    };

    const selectedRoom = document.getElementById("selectedRoom").value;
    const price = roomPrice[selectedRoom] || 0;
    let rooms = parseInt(document.getElementById("numberOfRooms").value);
    let extraPax = parseInt(document.getElementById("extraPax").value) || 0;
    let extraChildren = parseInt(document.getElementById("extraChildren").value) || 0;

    // Limit combined extra pax (adults + children) based on room type
    const maxAllowedPax = maxExtraPax[selectedRoom] || 0;
    const totalExtraPax = extraPax + extraChildren;
    if (totalExtraPax > maxAllowedPax) {
        // Adjust to fit within the limit, prioritizing adults
        const excess = totalExtraPax - maxAllowedPax;
        if (extraChildren >= excess) {
            extraChildren = extraChildren - excess;
            document.getElementById("extraChildren").value = extraChildren;
        } else {
            extraPax = maxAllowedPax - extraChildren;
            document.getElementById("extraPax").value = extraPax;
        }
    }

    if (selectedRoom === "Casa De Amor" && rooms > 3) {
        rooms = 3;
        document.getElementById("numberOfRooms").value = 3;
    } else if (selectedRoom !== "Casa De Amor") {
        rooms = 1;
        document.getElementById("numberOfRooms").value = 1;
    }

    // Calculate total cost
    const roomTotal = price * rooms * nights;
    const extraPaxTotal = extraPax * 300 * nights; // Extra adults at 300/head
    const extraChildrenTotal = extraChildren * 250 * nights; // Extra children at 250/head
    const totalPrice = roomTotal + extraPaxTotal + extraChildrenTotal;

    const totalAmount = `₱${totalPrice.toLocaleString()}`;
    document.getElementById("totalAmount").value = totalAmount;
    
    // Store room total for payment calculation
    document.getElementById("totalAmount").dataset.roomTotal = roomTotal;
    
    // Update payment amount
    updatePaymentAmount();
}
    </script>
</body>
</html>
