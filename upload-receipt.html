<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Payment Receipt - Agcararao Mountain View Resort</title>
   <link rel="icon" type="image/png" href="lowo.png"> 
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #90ee90 0%, #98fb98 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 16px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="email"],
        input[type="text"],
        select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #4caf50;
        }

        .file-upload-wrapper {
            position: relative;
            border: 2px dashed #4caf50;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: #f1f8f4;
            cursor: pointer;
            transition: all 0.3s;
        }

        .file-upload-wrapper:hover {
            background: #e8f5e9;
            border-color: #2e7d32;
        }

        .file-upload-wrapper.has-file {
            border-color: #4caf50;
            background: #f1f8f4;
        }

        input[type="file"] {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            cursor: pointer;
        }

        .upload-icon {
            font-size: 48px;
            color: #4caf50;
            margin-bottom: 10px;
        }

        .upload-text {
            color: #666;
            font-size: 15px;
        }

        .upload-text strong {
            color: #4caf50;
        }

        .file-info {
            display: none;
            margin-top: 10px;
            color: #4caf50;
            font-weight: 600;
        }

        .preview-container {
            display: none;
            margin-top: 20px;
            text-align: center;
        }

        .preview-container img {
            max-width: 100%;
            max-height: 300px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1b5e20 0%, #2d5016 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(27, 94, 32, 0.4);
        }

        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .info-box {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .info-box h3 {
            color: #856404;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .info-box p {
            color: #856404;
            font-size: 14px;
            line-height: 1.6;
        }

        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4caf50;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px 15px;
                border-radius: 15px;
                max-width: 95%;
            }

            h1 {
                font-size: 20px;
            }

            .subtitle {
                font-size: 14px;
            }

            .logo {
                width: 50px;
                height: 50px;
            }

            .header {
                margin-bottom: 20px;
            }

            .form-group {
                margin-bottom: 18px;
            }

            .info-box {
                padding: 12px;
                margin-bottom: 18px;
            }

            .info-box h3 {
                font-size: 14px;
            }

            .info-box p {
                font-size: 13px;
            }

            label {
                font-size: 13px;
            }

            input[type="email"],
            input[type="text"],
            select {
                padding: 10px 12px;
                font-size: 14px;
            }

            .file-upload-wrapper {
                padding: 20px;
            }

            .upload-icon {
                font-size: 36px;
            }

            .upload-text {
                font-size: 14px;
            }

            .submit-btn {
                padding: 12px;
                font-size: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="logo.png" alt="Resort Logo" class="logo" onerror="this.style.display='none'">
            <h1>Upload Payment Receipt</h1>
            <p class="subtitle">Submit your down payment receipt for verification</p>
        </div>

        <div class="info-box">
            <h3>📋 Important Information</h3>
            <p>Please upload a clear photo of your payment receipt. Accepted formats: JPG, PNG, PDF. Maximum file size: 5MB.</p>
        </div>

        <form id="receiptForm">
            <div class="form-group">
                <label for="bookingType">Booking Type *</label>
                <select id="bookingType" required>
                    <option value="">Select booking type</option>
                    <option value="room">Room Reservation</option>
                    <option value="activity">Activity Reservation</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input type="email" id="email" placeholder="Enter the email used for booking" required>
            </div>

            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input type="text" id="fullName" placeholder="Enter your full name used for booking" required>
            </div>

            <div class="form-group">
                <label>Upload Receipt *</label>
                <div class="file-upload-wrapper" id="fileUploadWrapper">
                    <input type="file" id="receiptFile" accept="image/*,.pdf" required>
                    <div class="upload-icon">📤</div>
                    <div class="upload-text">
                        <strong>Click to upload</strong> or drag and drop<br>
                        <small>JPG, PNG, or PDF (Max 5MB)</small>
                    </div>
                    <div class="file-info" id="fileInfo"></div>
                </div>
            </div>

            <div class="preview-container" id="previewContainer">
                <img id="previewImage" src="" alt="Receipt Preview">
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Submit Receipt</button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #4caf50;">Uploading receipt...</p>
            </div>

            <div class="message" id="message"></div>
        </form>
    </div>

    <!-- Firebase Configuration -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getDatabase, ref, query, orderByChild, equalTo, get, update } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBAE0ieuAJRp_rF4I90qXP8zPr4TQW_rIg",
            authDomain: "agcararaoret.firebaseapp.com",
            databaseURL: "https://agcararaoret-default-rtdb.firebaseio.com",
            projectId: "agcararaoret",
            storageBucket: "agcararaoret.appspot.com",
            messagingSenderId: "369964400118",
            appId: "1:369964400118:web:bd0e0f15ef0e235392dbd7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Test database connection
        console.log('Firebase initialized. Database URL:', firebaseConfig.databaseURL);

        let selectedFile = null;

        // File upload handling
        const fileInput = document.getElementById('receiptFile');
        const fileUploadWrapper = document.getElementById('fileUploadWrapper');
        const fileInfo = document.getElementById('fileInfo');
        const previewContainer = document.getElementById('previewContainer');
        const previewImage = document.getElementById('previewImage');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Check file size (5MB limit)
                if (file.size > 5 * 1024 * 1024) {
                    showMessage('File size must be less than 5MB', 'error');
                    fileInput.value = '';
                    return;
                }

                selectedFile = file;
                fileUploadWrapper.classList.add('has-file');
                fileInfo.style.display = 'block';
                fileInfo.textContent = `✓ ${file.name}`;

                // Show preview for images
                if (file.type.startsWith('image/')) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        previewImage.src = e.target.result;
                        previewContainer.style.display = 'block';
                    };
                    reader.readAsDataURL(file);
                } else {
                    previewContainer.style.display = 'none';
                }
            }
        });

        // Form submission
        document.getElementById('receiptForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const bookingType = document.getElementById('bookingType').value;
            const email = document.getElementById('email').value.trim().toLowerCase();
            const fullName = document.getElementById('fullName').value.trim();

            if (!selectedFile) {
                showMessage('Please select a receipt file to upload', 'error');
                return;
            }

            // Show loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;

            // Add timeout to prevent infinite loading
            const timeout = setTimeout(() => {
                showMessage('Request timed out. Please check your internet connection and try again.', 'error');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            }, 15000); // 15 second timeout

            try {
                console.log('Step 1: Finding booking...');
                console.log('Looking in:', bookingType === 'room' ? 'bookings' : 'activities');
                console.log('Email:', email);
                
                // Find the booking (without requiring index)
                const dbPath = bookingType === 'room' ? 'bookings' : 'activities';
                const bookingsRef = ref(db, dbPath);
                
                console.log('Fetching all bookings...');
                const snapshot = await get(bookingsRef);
                clearTimeout(timeout); // Clear timeout on success

                console.log('Step 2: Query result:', snapshot.exists());

                if (!snapshot.exists()) {
                    showMessage('No bookings found in the database.', 'error');
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('submitBtn').disabled = false;
                    return;
                }

                // Find matching booking by email and full name
                let bookingId = null;
                let bookingData = null;

                snapshot.forEach((child) => {
                    const data = child.val();
                    const dataEmail = (data.email || '').toLowerCase();
                    const dataName = (data.fullName || data.name || '').toLowerCase();
                    console.log('Checking:', dataEmail, dataName);
                    
                    if (dataEmail === email && dataName === fullName.toLowerCase()) {
                        bookingId = child.key;
                        bookingData = data;
                        console.log('Match found!');
                    }
                });

                if (!bookingId) {
                    showMessage('No booking found with this name and email combination. Please check your spelling.', 'error');
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('submitBtn').disabled = false;
                    return;
                }

                console.log('Step 3: Booking found:', bookingId);

                // Convert image to base64 (stores directly in database - no storage rules needed)
                const reader = new FileReader();
                const base64Promise = new Promise((resolve, reject) => {
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(selectedFile);
                });

                console.log('Step 4: Converting to base64...');
                const receiptDataUrl = await base64Promise;
                console.log('Step 5: Base64 conversion complete');

                // Update booking with receipt
                const bookingRef = ref(db, `${dbPath}/${bookingId}`);
                await update(bookingRef, {
                    receiptUrl: receiptDataUrl,
                    receiptUploadedAt: new Date().toISOString()
                });

                console.log('Step 6: Database updated successfully!');

                // Show success message
                showMessage('✓ Receipt uploaded successfully! The admin will review your payment shortly.', 'success');
                document.getElementById('receiptForm').reset();
                fileUploadWrapper.classList.remove('has-file');
                fileInfo.style.display = 'none';
                previewContainer.style.display = 'none';
                selectedFile = null;

            } catch (error) {
                clearTimeout(timeout); // Clear timeout on error
                console.error('Detailed error:', error);
                console.error('Error code:', error.code);
                console.error('Error stack:', error.stack);
                showMessage(`Error: ${error.message || 'Unknown error occurred'}. Please try again.`, 'error');
            } finally {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';

            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 8000);
        }
    </script>
</body>
</html>
